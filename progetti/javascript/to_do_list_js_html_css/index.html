<!DOCTYPE html>
<html lang="it">
<head>

    <title>To do List</title>
    <link rel="stylesheet" href="style.css">
</head>

        <div class="todo-app">

            <ul id="list-container">

                <!-- <li class="checked">attivita 1</li>
                <li >attivita 2</li>
                <li>attivita 3</li> -->
            </ul>
        </div>
    </div>
    <script src="/script.js"></script>

</html>
